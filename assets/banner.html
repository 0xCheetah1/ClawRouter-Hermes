<!--
  Source for assets/banner.png (2560x608, rendered at 1280x304 @2x).
  Deliberately carries no model count or savings figure: a PNG can't be kept in
  step by scripts/sync-brand-numbers.mjs, so numbers stay out of the artwork.

  Regenerate:
    B=~/.claude/skills/gstack/browse/dist/browse
    $B viewport 1280x304 --scale 2
    $B load-html assets/banner.html
    $B screenshot assets/banner.png --selector '#banner'
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #fff; }
  #banner {
    width: 1280px;
    height: 304px;
    background: #fff;
    position: relative;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .wordmark {
    font-size: 62px;
    font-weight: 700;
    letter-spacing: -1.2px;
    line-height: 1.1;
    white-space: nowrap;
  }
  .wordmark .lobster { font-size: 54px; vertical-align: 2px; margin-right: 10px; }
  .wordmark .claw { color: #cc2028; }
  .wordmark .sep { color: #c9ccd1; font-weight: 300; margin: 0 14px; }
  .wordmark .hermes { color: #16181d; }
  .tagline {
    margin-top: 22px;
    font-size: 27px;
    font-weight: 400;
    color: #2f3237;
    letter-spacing: -0.2px;
  }
  .tagline b { font-weight: 600; color: #16181d; }
  .credit {
    position: absolute;
    right: 30px;
    bottom: 18px;
    font-size: 15px;
    font-weight: 700;
    color: #8a8f96;
  }
</style>

<div id="banner">
  <div class="wordmark">
    <span class="lobster">🦞</span><span class="claw">ClawRouter</span><span class="sep">×</span><span class="hermes">Hermes</span>
  </div>
  <div class="tagline"><b>Every model</b>, one wallet, zero API keys.</div>
  <div class="credit">brought to you by BlockRun.AI</div>
</div>
